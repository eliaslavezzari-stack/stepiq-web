<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Reset Password - StepIQ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 380px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1.2px;
      color: #fff;
    }
    .header p {
      color: #555;
      font-size: 15px;
      margin-top: 8px;
    }

    .field { margin-top: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 15px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.18s;
    }
    .field input:focus { border-color: #00e676; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      margin-top: 24px;
      -webkit-appearance: none;
      transition: opacity 0.18s;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .msg {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.error   { background: rgba(255,69,58,0.1);   color: #ff6b63; border: 1px solid rgba(255,69,58,0.2); }
    .msg.success { background: rgba(0,230,118,0.08);  color: #00e676; border: 1px solid rgba(0,230,118,0.18); }
    .msg.neutral { background: rgba(255,255,255,0.04); color: #666;   border: 1px solid #222; }

    .spinner {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(0,0,0,0.25);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #view-form    { display: none; }
    #view-success { display: none; }
    #view-notoken { display: none; }
    #view-loading { text-align: center; color: #444; font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>
  <div class="card">

    <div class="header">
      <h1>StepIQ</h1>
      <p>Reset your password</p>
    </div>

    <div id="view-loading">Verifying link...</div>

    <div id="view-form">
      <div class="field">
        <label for="pw1">New password</label>
        <input id="pw1" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="pw2">Confirm password</label>
        <input id="pw2" type="password" placeholder="Repeat your password" autocomplete="new-password" />
      </div>
      <div id="form-msg"></div>
      <button class="btn" id="submit-btn">Update password</button>
    </div>

    <div id="view-success">
      <div class="msg success">
        Password updated &mdash; return to StepIQ and sign in with your new password.
      </div>
    </div>

    <div id="view-notoken">
      <div class="msg neutral" id="notoken-msg">
        This page can only be opened from a StepIQ password reset email.
        To reset your password, open StepIQ and tap &ldquo;Forgot password?&rdquo; on the sign-in screen.
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    var SUPABASE_URL      = 'https://mvhxqfdofckshmdhspzv.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12aHhxZmRvZmNrc2htZGhzcHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTcxMTQsImV4cCI6MjA5NDMzMzExNH0.JBfWEdv1F1pXaz8DIu3lEkHNN3095X5G3Z-kAvAmMfA';

    var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false }
    });

    function show(id) {
      ['view-loading','view-form','view-success','view-notoken'].forEach(function(v) {
        document.getElementById(v).style.display = (v === id) ? 'block' : 'none';
      });
    }

    function setFormMsg(type, text) {
      var el = document.getElementById('form-msg');
      el.innerHTML = text ? '<div class="msg ' + type + '">' + text + '</div>' : '';
    }

    function parseHash() {
      var raw = window.location.hash.replace(/^#/, '');
      return Object.fromEntries(new URLSearchParams(raw));
    }

    function parseQuery() {
      return Object.fromEntries(new URLSearchParams(window.location.search));
    }

    function showExpired() {
      document.getElementById('notoken-msg').textContent =
        'This reset link has expired or is invalid. Please request a new one from the StepIQ app.';
      show('view-notoken');
    }

    async function init() {
      var hash  = parseHash();
      var query = parseQuery();

      // PKCE flow: ?code=...
      if (query.code) {
        var r1 = await db.auth.exchangeCodeForSession(query.code);
        if (r1.error) { showExpired(); return; }
        show('view-form');
        document.getElementById('pw1').focus();
        return;
      }

      // Implicit flow: #access_token=...&type=recovery
      if (hash.access_token && hash.type === 'recovery') {
        var r2 = await db.auth.setSession({
          access_token:  hash.access_token,
          refresh_token: hash.refresh_token || ''
        });
        if (r2.error) { showExpired(); return; }
        show('view-form');
        document.getElementById('pw1').focus();
        return;
      }

      // No token
      show('view-notoken');
    }

    async function handleSubmit() {
      var pw1 = document.getElementById('pw1').value;
      var pw2 = document.getElementById('pw2').value;

      setFormMsg('', '');

      if (pw1.length < 8) {
        setFormMsg('error', 'Password must be at least 8 characters.');
        return;
      }
      if (pw1 !== pw2) {
        setFormMsg('error', 'Passwords do not match.');
        return;
      }

      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>Updating...';

      var result = await db.auth.updateUser({ password: pw1 });

      if (result.error) {
        btn.disabled = false;
        btn.textContent = 'Update password';
        setFormMsg('error', 'Update failed - your link may have expired. Please request a new reset email from StepIQ.');
        return;
      }

      show('view-success');
    }

    document.getElementById('submit-btn').addEventListener('click', handleSubmit);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.getElementById('view-form').style.display !== 'none') {
        handleSubmit();
      }
    });

    init();
  </script>
</body>
</html>
